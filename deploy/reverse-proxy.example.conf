# Example server block for the existing Nginx reverse proxy on the TrueNAS host.
# Replace site.example.com with your domain, and adjust the upstream address
# and certificate paths to your own setup.
server {
    listen 80;
    server_name site.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name site.example.com;

    ssl_certificate     /etc/letsencrypt/live/site.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://TRUENAS_IP:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The login (oauth2-proxy) sets a session cookie of a few kB.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}
