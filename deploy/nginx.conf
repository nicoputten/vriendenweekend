# Nginx config inside the site container. TLS and the domain are handled by the
# reverse proxy on the TrueNAS host; this container only speaks HTTP on port 8080.
#
# Login (US-004): oauth2-proxy and Dex run as extra containers in the same app.
# This Nginx routes /oauth2/ and /dex/ to them and asks oauth2-proxy whether a
# visitor is logged in before serving a members-only page. The upstream names
# are resolved per request (Docker's DNS), so the site still starts and serves
# its public pages when the login containers are not deployed.

# Keep the scheme the outer reverse proxy saw (https), fall back to our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Path of the request without the query string, still URL-encoded (unlike $uri),
# so it is safe to put in a Location header.
map $request_uri $request_path {
    ~^(?<path>[^?]*) $path;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    # Docker's embedded DNS server, for the login containers below.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 3s;
    set $oauth2_proxy "http://oauth2-proxy:4180";
    set $dex "http://dex:5556";

    # Hashed Astro assets can be cached for a long time.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Always revalidate pages so updates show up immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    # Members-only pages: /leden, /leden.html and everything under /leden/.
    location ~ ^/leden(?:/|\.html)?$|^/leden/ {
        auth_request /_oauth2/auth;
        error_page 401 = @login;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
        try_files $uri $uri.html =404;
    }

    # Send visitors without a session to the login page, and back here afterwards.
    location @login {
        return 302 /inloggen?rd=$request_path;
    }

    # Subrequest for auth_request: 202 with a valid session, 401 without.
    location = /_oauth2/auth {
        internal;
        proxy_pass $oauth2_proxy/oauth2/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Original-URI $request_uri;
    }

    # oauth2-proxy: /oauth2/start, /oauth2/callback, /oauth2/sign_out, /oauth2/userinfo.
    location /oauth2/ {
        proxy_pass $oauth2_proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        add_header Cache-Control "no-store" always;
    }

    # A rejected or failed login lands on our own Dutch login page instead of
    # oauth2-proxy's English error page.
    location = /oauth2/callback {
        proxy_pass $oauth2_proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_intercept_errors on;
        error_page 403 = @login_denied;
        error_page 400 500 502 503 504 = @login_failed;
    }
    location @login_denied {
        return 302 /inloggen?fout=geen-toegang;
    }
    location @login_failed {
        return 302 /inloggen?fout=mislukt;
    }

    # Dex, the login broker that talks to Google and Microsoft.
    location /dex/ {
        proxy_pass $dex;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        add_header Cache-Control "no-store" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
}
