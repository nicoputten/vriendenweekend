# All updates are collected into a single weekly pull request against develop.
version: 2

multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    # With multi-ecosystem groups, target-branch is only allowed on the group.
    target-branch: develop

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      # Node types must match the Node major we run on (see .nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript majors need @astrojs/check support first; bump manually.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly

  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      # Stay on Node LTS; move to the next LTS major manually (with .nvmrc).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
