# Integration test for the login (US-004): the real site image, oauth2-proxy
# and Dex with a mock login instead of Google or Microsoft.
# Run with tests/auth/run.sh (also runs in CI).
name: vriendenweekend-auth-test

x-auth-env: &auth-env
  PUBLIC_URL: http://localhost:8088
  OAUTH2_PROXY_CLIENT_SECRET: test-client-secret

services:
  vriendenweekend:
    image: vriendenweekend:auth-test
    build: ../..
    ports:
      - "8088:8080"
    read_only: true
    tmpfs:
      - /tmp

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
    command: ["--alpha-config=/config/oauth2-proxy.yaml"]
    environment:
      <<: *auth-env
      OAUTH2_PROXY_COOKIE_SECRET: dGVzdC1jb29raWUtc2VjcmV0LTMyLWJ5dGVzLWxvbmc=
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_COOKIE_EXPIRE: 720h
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:8088/oauth2/callback
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /emails/allowed-emails.txt
    volumes:
      - ../../deploy/auth/oauth2-proxy.yaml:/config/oauth2-proxy.yaml:ro
      - ${AUTH_TEST_EMAILS_DIR:?set by run.sh}:/emails:ro

  dex:
    image: dexidp/dex:v2.46.1
    command: ["dex", "serve", "/config/dex.yaml"]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      <<: *auth-env
      DEX_MOCK_LOGIN: "true"
    volumes:
      - ../../deploy/auth/dex.yaml:/config/dex.yaml:ro
